<!DOCTYPE html>
<html>

    <head>
        <title>Registration</title>
    </head>

    <body>
      <h1>Registration Form</h1>

       <form>
         <lable for="username">UserNam:</lable>
         <input 
            type="text"
            id="username"
            name="username"
            mainlenth="2"
            maxlenth="10"
            atuocomplete="username"
            required >

            <br><br>

            <label for="email">Email:</label>
            <input
               type="email"
               id="email"
               autocommplete="email"
               required >

               <br><br>

            <label for="phone">Phone</label>
            <input
               type="tel"
               id="phone"
               name="phone"
               pattern="[0-9]{10}"
               autocomplete="tel"
               placeholder="10 digit phone number"
               required >

               <br><br>

               <label for="age">Age:</label>
               <input
                  type="numbeer"
                  id="age"
                  name="age"
                  mainlenth="18"
                  maxlenth="100"
                  required >

                  <br><br>

                  <label for="account">Account:</label>
                  <input
                     type="text"
                     id="account"
                     name="account"
                     value="ACC001"
                     required >

                     <br><br>

            <button type="submit">Register</button>

       </form>        
    </body>
</html>
