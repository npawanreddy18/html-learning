<!DOCTYPE html>

<html>
    <head>
        <title>food order</title>
    </head>

    <body>

        <h1>Food Order Form</h1>
        <form>
            <label for="name">Name:</label>
            <input 
                 type="text" 
                 id="name" 
                 name="name" 
                 placeholder="Enter your Name" 
                 required >

                 <br><br>

                 <label for="email">Email:</label>
                 <input
                     type="email"
                     id="email"
                     name="email"
                     placeholder="Enter your Email"
                     required >

                     <br><br>

                 <label for="phone">Phone:</label>
                 <input 
                     type="tel"
                     id="phone"
                     name="phone"
                     pattern="[0-9]{10}"
                     placeholder="10 digit Mobile Number"
                     required >

                     <br><br>

                 <label for="food">FOOD:</label>
                 <select id="food" name="food" required>
                    <option value="">Select Food</option>
                    <option value="pizza">Pizza</option>
                    <option value="Burger">Burger</option>
                    <option value="Biryani">Biryani</option>
                    <option value="noodles">Noodles</option>
                 </select>

                 <br><br>

                 <label for="quantity">Quantity:</label>
                 <input 
                     type="number"
                     id="quantity"
                     name="quantity"
                     min="2"
                     max="10"
                     value="2"
                     required >

                     <br><br>

                     <label for="instructions">Delivery Instructions:</label>
                     <br>
                     <textarea 
                         id="instructions"
                         name="instructions"
                         rows="8"
                         cols="40"
                         placeholder="Example: Leave the food at the door">
                     </textarea>

                     <br>

                     <p>Choose payment method:</p>

                     <label>
                        <input
                            type="radio"
                            name="payment"
                            value="upi">UPI
                     </label>

                     <br>

                     <label>
                        <input
                            type="radio"
                            name="payment"
                            value="card">Card
                     </label>

                     <br>

                     <label>
                        <input
                            type="radio"
                            name="payment"
                            value="cash">Cash
                     </label>

                     <br>

                     <p>Choose extra:</p>

                     <label>
                        <input 
                            type="checkbox"
                            name="extra"
                            value="cheese">Extra cheese
                     </label>

                     <br>

                     <label>
                        <input
                            type="checkbox"
                            name="extra"
                            value="sauce">Extra sauce
                     </label>

                     <br>

                     <label>
                        <input
                            type="checkbox"
                            name="extra"
                            value="drink">Cold Drink
                     </label>

                     <br><br>

                     <label for="food-image">Upload Food Image:</label>
                        <input
                            type="file"
                            id="food-image"
                            name="food-image">

                            <br><br>

                            <button type="submit">Place Order</button>
        </form>
    </body>
</html>
